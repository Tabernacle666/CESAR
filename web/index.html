<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>César · Workflow Studio</title><style>
:root{color-scheme:dark;--bg:#10151c;--layer:#161d25;--panel:#1a232d;--border:#2b3642;--soft:#a0b0c1;--text:#e6edf5;--aqua:#72d0c8;--aqua2:#183a3c;--warn:#e7b66d;--good:#69c6a4;--red:#e99595}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 74% -21%,#283e50 0%,transparent 40%),var(--bg);color:var(--text);font:13px/1.45 system-ui,-apple-system,'Segoe UI',sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}.wrap{height:100vh;min-height:520px;display:flex;flex-direction:column;overflow:hidden}.top{display:flex;align-items:center;padding:14px 20px;border-bottom:1px solid var(--border);gap:15px;background:#131b24dd}.brand{font-size:18px;font-weight:800;letter-spacing:-.6px;white-space:nowrap}.brand span{color:var(--aqua)}.path{color:var(--soft);font-size:11px;flex:1}.conn{display:flex;align-items:center;gap:7px;color:var(--soft);font-size:11px}.dot{width:8px;height:8px;background:#64717d;border-radius:50%}.dot.ok{background:var(--good)}.columns{display:grid;grid-template-columns:250px minmax(430px,1fr) 285px;min-height:0;flex:1}.left,.center,.right{overflow:auto;min-height:0;padding:17px}.left,.center{border-right:1px solid var(--border)}.left{background:#121a22}.right{background:#141c25}.eyebrow{color:var(--soft);font-size:10px;font-weight:750;letter-spacing:1.45px;text-transform:uppercase;margin-bottom:9px}.muted{color:var(--soft)}h1{font-size:23px;letter-spacing:-.8px;margin:1px 0 5px;line-height:1.15}h2{font-size:16px;margin:3px 0 12px;letter-spacing:-.3px}p{margin:8px 0}.small{font-size:11px;color:var(--soft)}.tree-item{display:flex;align-items:center;gap:9px;width:100%;border:1px solid transparent;background:none;padding:9px 8px;text-align:left;border-radius:8px;margin:2px 0;min-width:0}.tree-item:hover{background:#22303c}.tree-item.active{background:#224144;border-color:#3c6668}.tree-item .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.tree-item .rightbit{color:var(--soft);font-variant-numeric:tabular-nums;font-size:10px}.tree-item.child{padding-left:30px;font-size:12px}.state-dot{display:inline-block;height:7px;width:7px;border-radius:50%;background:#778393;flex:none}.state-dot.ok{background:var(--good)}.state-dot.missing{background:var(--warn)}.headerrow{display:flex;justify-content:space-between;align-items:center;gap:10px}.rule{height:1px;background:var(--border);margin:18px 0}.pill{border:1px solid var(--border);border-radius:30px;padding:4px 8px;color:var(--soft);font-size:10px;white-space:nowrap}.pill.ok{color:var(--good);border-color:#39665c}.pill.warn{color:var(--warn);border-color:#795d3b}.card{border:1px solid var(--border);background:#18222d;border-radius:11px;padding:15px;margin:12px 0}.light{background:linear-gradient(135deg,#1b2d38,#213d44);border:1px solid #36535b;border-radius:9px;padding:18px;display:flex;align-items:center;gap:15px;margin:16px 0}.light big{font-size:28px;font-weight:750}.light span{color:#aec6cc}.statline{display:flex;flex-wrap:wrap;gap:9px;margin:15px 0}.metric{background:#1b2731;border:1px solid var(--border);border-radius:9px;padding:11px 13px;min-width:100px}.metric strong{font-size:23px;display:block}.metric span{color:var(--soft);font-size:10px}label.field{display:block;margin:14px 0;color:var(--soft);font-size:11px}label.field>span{display:block;margin:0 0 7px}input[type=text],input[type=number],select,textarea{background:#0f1821;border:1px solid #3a4653;border-radius:7px;padding:10px;width:100%;outline:none}input:focus,select:focus,textarea:focus{border-color:#69acae}textarea{min-height:260px;resize:vertical;line-height:1.45;font-size:12px}textarea.neg{min-height:78px}input[type=checkbox]{accent-color:var(--aqua)}.btn{background:#22313d;border:1px solid #40515f;border-radius:7px;padding:9px 12px;font-weight:650;white-space:nowrap}.btn:hover{background:#2f4754}.btn.primary{background:var(--aqua);color:#102b2e;border-color:var(--aqua)}.btn.primary:hover{background:#95e1d9}.btn.danger{color:var(--red);border-color:#895657}.btn.sm{font-size:11px;padding:6px 8px}.btn.outline{background:transparent}.btnrow{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:12px}.frames{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}.framecard{background:#16212a;border:1px solid #344653;border-radius:10px;padding:10px;min-width:0}.framehead{display:flex;justify-content:space-between;gap:6px;margin-bottom:9px;font-size:11px;font-weight:800}.framepreview{height:116px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#0d161d;border-radius:7px;position:relative;border:1px solid #31404b}.framepreview img{width:100%;height:100%;object-fit:cover}.framepreview .empty{text-align:center;color:#8998a7;font-size:11px}.framepreview .empty strong{font-size:20px;display:block}.framecard input[type=text]{font-family:ui-monospace,monospace;font-size:10px;padding:7px;margin:9px 0 2px}.frametime{display:flex;align-items:center;gap:5px;color:var(--soft);font-size:10px;margin-top:7px}.frametime input{width:75px;padding:5px}.frow{display:flex;align-items:center;justify-content:space-between;gap:5px}.missing{color:var(--warn)}.present{color:var(--good)}.timeline{height:38px;position:relative;margin:10px 4px 18px;border-bottom:2px solid #3f6070}.tpoint{position:absolute;bottom:-6px;width:10px;height:10px;border-radius:50%;transform:translateX(-50%);background:var(--aqua);box-shadow:0 0 9px #53adaa66}.tlabel{position:absolute;bottom:7px;transform:translateX(-50%);font-size:10px;color:var(--soft)}.panelnote{font-size:11px;color:var(--soft);line-height:1.6;margin-top:8px}.loglist{max-height:130px;overflow:auto;line-height:1.75;font-size:11px}.queuebar{border-top:1px solid var(--border);background:#141c26;display:flex;align-items:center;gap:14px;padding:12px 19px;min-height:73px}.queueinfo{flex:1;min-width:0}.queueinfo strong{font-size:12px}.queueinfo div{color:var(--soft);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.error{color:var(--red)}.toast{position:fixed;bottom:85px;right:18px;z-index:50;max-width:420px;padding:13px 15px;background:#253b47;border:1px solid #3e7280;border-radius:8px;box-shadow:0 15px 50px #0008}.toast.err{background:#4b262b;border-color:#9e505b}.modalbg{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}.modal{background:#192530;border:1px solid #44606a;border-radius:12px;padding:17px;max-width:680px;width:100%;max-height:83vh;display:flex;flex-direction:column;gap:10px}.imagelist{min-height:80px;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:9px}.imageopt{text-align:left;background:#17222a;border:1px solid #354553;border-radius:7px;padding:8px;overflow:hidden}.imageopt:hover{border-color:var(--aqua)}.imageopt img{width:100%;height:83px;object-fit:cover;border-radius:5px;background:#101820}.imageopt span{display:block;font-size:10px;overflow-wrap:anywhere}.cliplist{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin:13px 0}.clipcard{text-align:left;background:#192630;border:1px solid var(--border);border-radius:9px;padding:12px}.clipcard:hover{border-color:var(--aqua)}.clipcard strong{display:block}.clipcard p{font-size:11px;color:var(--soft);min-height:32px}.mark{color:var(--good);font-size:11px}.warning{background:#382c1d;border:1px solid #6f5233;border-radius:8px;padding:9px;font-size:11px;color:#edc99e;margin-top:9px}.actionside{padding-top:10px}.spaced{display:flex;align-items:center;justify-content:space-between;gap:8px}.flexgap{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.qerr{color:var(--red)}
@media(max-width:1000px){.columns{grid-template-columns:195px minmax(350px,1fr)}.right{grid-column:1/-1;border-top:1px solid var(--border);max-height:200px}.center{border-right:0}.frames{gap:6px}.framepreview{height:90px}}
@media(max-width:650px){.columns{grid-template-columns:130px minmax(190px,1fr)}.left,.center,.right{padding:9px}.frames{grid-template-columns:1fr}.framepreview{height:100px}.top{padding:10px}.queuebar{flex-wrap:wrap}.right{max-height:none}.brand{font-size:15px}.path{display:none}}
</style></head><body><div class="wrap">
<header class="top"><div class="brand">CÉSAR <span>STUDIO</span></div><div class="path" id="bread">Projet / Scènes / Clips</div><div class="conn"><span class="dot" id="connDot"></span><span id="connText">ComfyUI · vérification</span></div></header>
<div class="columns"><aside class="left"><div class="headerrow"><div class="eyebrow">Arbre de production</div><button class="btn sm outline" id="refresh">↻</button></div><div id="tree"></div><div class="rule"></div><div class="small" id="treeStats"></div></aside><main class="center" id="content"></main><aside class="right" id="inspector"></aside></div>
<footer class="queuebar"><div class="queueinfo"><strong id="queueStatus">File de production · inactive</strong><div id="queueDetail">—</div></div><div class="flexgap"><button id="pause" class="btn sm">Pause</button><button id="resume" class="btn sm">Reprendre</button><button id="stop" class="btn sm">Arrêt propre</button><button id="interrupt" class="btn sm danger" title="Interrompt le prompt actif ComfyUI">Interrompre</button><button id="generate" class="btn primary">Générer</button></div></footer>
</div><div id="overlays"></div><script>
let tree=null,selection={level:'project',id:''},clip=null,dirty=false,expanded=new Set(['S01']),queueData=null,imagesCache=[];
const $=(sel,root=document)=>root.querySelector(sel);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function request(path,body){let r=await fetch(path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let data=await r.json();if(!r.ok)throw Error(data.error||`HTTP ${r.status}`);return data}
function toast(text,err=false){let d=document.createElement('div');d.className='toast'+(err?' err':'');d.textContent=text;$('#overlays').append(d);setTimeout(()=>d.remove(),5000)}
async function loadTree(){tree=await request('/api/tree');renderTree();if(selection.level==='clip'){clip=await request('/api/clip?key='+encodeURIComponent(selection.id))}renderSelection();await loadQueue()}
function currentScene(){return tree?.scenes.find(s=>s.id===selection.id||selection.id.startsWith(s.id+'_'))}
function currentClip(){return currentScene()?.clips.find(c=>c.key===selection.id)}
function status(x){if(x.ready)return 'ok';if(x.missing?.length)return 'missing';return ''}
function select(level,id){if(dirty&&!confirm('Modifications non sauvegardées. Changer de sélection ?'))return;selection={level,id};dirty=false;if(level==='scene')expanded.add(id);if(level==='clip')expanded.add(id.split('_')[0]);loadTree().catch(e=>toast(e.message,true))}
function renderTree(){if(!tree)return;let h=`<button class="tree-item ${selection.level==='project'?'active':''}" data-level="project" data-id=""><span class="state-dot"></span><span class="name">▤ ${esc(tree.project)}</span><span class="rightbit">${tree.count}</span></button>`;
for(const s of tree.scenes){h+=`<button class="tree-item ${selection.level==='scene'&&selection.id===s.id?'active':''}" data-level="scene" data-id="${s.id}"><span class="state-dot ${s.ready?'ok':''}"></span><span class="name">${expanded.has(s.id)?'⌄':'›'} &nbsp;${s.id} · ${esc(s.title)}</span><span class="rightbit">${s.clips.length}</span></button>`;
if(expanded.has(s.id))for(const c of s.clips)h+=`<button class="tree-item child ${selection.level==='clip'&&selection.id===c.key?'active':''}" data-level="clip" data-id="${c.key}" title="${esc(c.title)}"><span class="state-dot ${status(c)}"></span><span class="name">${c.clip} · ${esc(c.title)}</span><span class="rightbit">${c.ready?'✓':''}</span></button>`}
$('#tree').innerHTML=h;$('#treeStats').textContent=`${tree.scenes.length} scènes · ${tree.count} clips · ${tree.scenes.reduce((n,s)=>n+s.clips.filter(c=>c.ready).length,0)} Ready`;
$$('#tree .tree-item').forEach(b=>b.onclick=()=>{if(b.dataset.level==='scene'&&selection.level==='scene'&&selection.id===b.dataset.id){expanded.has(b.dataset.id)?expanded.delete(b.dataset.id):expanded.add(b.dataset.id);renderTree();return}select(b.dataset.level,b.dataset.id)})}
function $$(sel,root=document){return [...root.querySelectorAll(sel)]}
function renderSelection(){if(!tree)return;const s=currentScene();const loc=selection.level;
$('#bread').textContent=loc==='project'?tree.project:`${tree.project} / ${s?.id||''}${loc==='clip'?' / '+clip?.clip:''}`;
$('#generate').textContent=`▶ Générer ${loc==='project'?'projet':loc==='scene'?'scène':'clip'}`;
if(loc==='project')drawProject();else if(loc==='scene')drawScene(s);else if(clip)drawClip();drawInspector()}
function pill(text,isok){return `<span class="pill ${isok?'ok':'warn'}">${esc(text)}</span>`}
function drawProject(){let n=tree.count,ready=tree.scenes.reduce((t,s)=>t+s.clips.filter(c=>c.ready).length,0);$('#content').innerHTML=`<div class="eyebrow">Niveau 0 · Projet</div><h1>${esc(tree.project)}</h1><div class="small">Arbre construit depuis les noms et les nœuds de ${n} fichiers JSON ComfyUI</div><div class="statline"><div class="metric"><strong>${tree.scenes.length}</strong><span>SCÈNES</span></div><div class="metric"><strong>${n}</strong><span>CLIPS</span></div><div class="metric"><strong>${ready}</strong><span>CLIPS READY</span></div></div><div class="light"><big>▤</big><div><b>Workflow = document source</b><div class="small">Les JSON sont lus au démarrage, édités directement et envoyés à ComfyUI tels quels.</div></div></div><div class="btnrow"><a class="btn" style="text-decoration:none" href="/api/export">Exporter les 26 workflows JSON (.zip)</a></div><div class="eyebrow" style="margin-top:18px">Scènes</div><div class="cliplist">${tree.scenes.map(s=>`<button class="clipcard" data-scene="${s.id}"><strong>${s.id} · ${esc(s.title)}</strong><p>${s.clips.length} clips · ${s.clips.filter(c=>c.ready).length} Ready</p>${pill(s.ready?'Ready':'À produire',s.ready)}</button>`).join('')}</div>`;$$('[data-scene]').forEach(b=>b.onclick=()=>select('scene',b.dataset.scene))}
function drawScene(s){let ready=s.clips.filter(c=>c.ready).length;$('#content').innerHTML=`<div class="eyebrow">Niveau 1 · Scène</div><div class="headerrow"><h1>${esc(s.id)} · ${esc(s.title)}</h1>${pill(s.ready?'Ready':'En production',s.ready)}</div><div class="small">${s.clips.length} clips · ${ready} validés · ${s.clips.length-ready} restant(s)</div><div class="statline"><div class="metric"><strong>${s.clips.length}</strong><span>CLIPS</span></div><div class="metric"><strong>${ready}</strong><span>READY</span></div></div><div class="eyebrow">Clips de la scène</div><div class="cliplist">${s.clips.map(c=>`<button class="clipcard" data-key="${c.key}"><strong>${c.clip} &nbsp; ${pill(c.ready?'Ready':c.missing.length?'Guides manquants':'À produire',c.ready)}</strong><p>${esc(c.title)}</p><div class="small">${((c.frames-1)/c.fps).toFixed(1)} s · ${c.pass2?'Passe 2 ON':'Passe 2 OFF'}</div></button>`).join('')}</div><div class="btnrow"><a class="btn" style="text-decoration:none" href="/api/export?scene=${s.id}">Exporter les workflows ${s.id} (.zip)</a></div><div class="panelnote">Générer cette scène ignore les clips Ready et les scènes verrouillées. Les fichiers JSON des clips restent individuels.</div>`;$$('[data-key]').forEach(b=>b.onclick=()=>select('clip',b.dataset.key))}
function imgCard(label,guide){let norm=label.toLowerCase(),can=label==='FIRST'||guide.enabled;return `<div class="framecard" data-guide="${norm}"><div class="framehead"><span>${label}</span><span class="${guide.present?'present':'missing'}" data-presence>${guide.present?'● Présent':'○ Absent'}</span></div><div class="framepreview" data-preview>${guide.present?`<img alt="${label}" src="/api/image?name=${encodeURIComponent(guide.filename)}">`:'<div class="empty"><strong>▧</strong>Pas dans input</div>'}</div><div class="frametime">${label==='FIRST'?'Début · 0 s':label==='MIDDLE'?`<label><input type="checkbox" data-on="middle" ${guide.enabled?'checked':''}> Activer</label> <input type="number" data-time="middle" value="${guide.time}" min="0.333" step="0.333"> s`:`<label><input type="checkbox" data-on="last" ${guide.enabled?'checked':''}> Activer</label> <span>Fin du clip</span>`}</div><input type="text" data-filename="${norm}" value="${esc(guide.filename)}" title="Nom exact à utiliser dans ComfyUI/input"><button class="btn sm" data-browse="${norm}" style="width:100%;margin-top:7px">Parcourir input/</button></div>`}
function timelineHtml(c){const total=Math.max(0.001,c.duration),m=c.guides.middle;return `<div class="timeline"><span class="tlabel" style="left:2%">0 s</span><span class="tpoint" style="left:2%"></span>${m.enabled?`<span class="tlabel" style="left:${Math.max(3,Math.min(97,(m.time/total*96+2)))}%">${m.time}s</span><span class="tpoint" style="left:${Math.max(3,Math.min(97,(m.time/total*96+2)))}%"></span>`:''}<span class="tlabel" style="left:98%">${total} s</span><span class="tpoint" style="left:98%"></span></div>`}
function drawClip(){let c=clip;$('#content').innerHTML=`<div class="eyebrow">Niveau 2 · Clip · ${c.key}</div><div class="headerrow"><h1>${esc(c.title)}</h1>${pill(c.ready?'Ready':'À produire',c.ready)}</div><div class="small">${esc(c.filename)} · ${c.node_count} nœuds · ${c.fps} FPS</div><div class="card"><div class="headerrow"><b>Durée et jalons</b><span class="small">8n + 1 frames</span></div><div class="flexgap" style="margin-top:10px"><label class="field" style="margin:0;max-width:140px"><span>Fin du clip (s)</span><input id="duration" type="number" min="5" max="20" step="0.333333" value="${c.duration}"></label><div class="small">${c.frames} frames · ${c.fps} FPS</div></div>${timelineHtml(c)}</div><div class="headerrow"><div class="eyebrow" style="margin:0">Guides FIRST / MIDDLE / LAST</div><button class="btn sm" id="reloadImgs">↻ Vérifier input</button></div><div class="frames">${imgCard('FIRST',c.guides.first)}${imgCard('MIDDLE',c.guides.middle)}${imgCard('LAST',c.guides.last)}</div><div class="card"><div class="headerrow"><b>Prompt LTX 2.3</b><span class="small">Ordre narratif conservé</span></div><textarea id="prompt" spellcheck="false" style="margin-top:10px">${esc(c.prompt)}</textarea><details style="margin-top:12px"><summary class="small">Prompt négatif</summary><textarea id="negative" class="neg">${esc(c.negative_prompt)}</textarea></details></div><div class="btnrow"><button class="btn primary" id="saveClip">Enregistrer dans le JSON</button><a class="btn" style="text-decoration:none" href="/api/workflow?key=${encodeURIComponent(c.key)}">Télécharger le workflow</a><span class="small" id="saveStatus">${dirty?'Modifications non enregistrées':''}</span></div>`;
$$('#content input,#content textarea').forEach(e=>e.addEventListener('input',markDirty));$$('[data-on]').forEach(e=>e.addEventListener('change',markDirty));$$('[data-browse]').forEach(b=>b.onclick=()=>browse(b.dataset.browse));$('#saveClip').onclick=saveClip;$('#reloadImgs').onclick=()=>loadTree().catch(e=>toast(e.message,true))}
function inheritedPass2(){if(selection.level==='project')return tree.project_pass2;let scene=currentScene();let v=scene?.pass2_setting==='inherit'?tree.project_pass2:scene?.pass2_setting==='on';if(selection.level==='clip')v=clip.pass2_setting==='inherit'?v:clip.pass2_setting==='on';return v}
function drawInspector(){let loc=selection.level,scene=currentScene();let setting=loc==='project'?tree.project_pass2?'on':'off':loc==='scene'?scene.pass2_setting:clip.pass2_setting;let val=loc==='project'?tree.project_pass2:loc==='scene'?inheritedPass2():clip.pass2_effective;
let h=`<div class="eyebrow">Inspecteur · ${loc==='project'?'Projet':loc==='scene'?'Scène':'Clip'}</div><div class="card" style="margin-top:0"><b>Deuxième passe · Upscale latent</b><label class="field"><span>Règle de ce niveau</span><select id="pass2">${loc==='project'?'':'<option value="inherit">Hériter du parent</option>'}<option value="on">Activée</option><option value="off">Désactivée</option></select></label><div class="small">Valeur effective : <b>${val?'Activée':'Désactivée'}</b></div><button class="btn sm" id="saveScopePass" style="margin-top:13px">Appliquer la règle</button></div>`;
if(loc==='project'){h+=`<div class="eyebrow">Configuration locale</div><label class="field"><span>Nom du projet</span><input id="projectName" type="text" value="${esc(tree.project)}"></label><label class="field"><span>Dossier ComfyUI/input sur le PC</span><input id="inputDir" type="text" value="${esc(tree.input_dir)}"></label><label class="field"><span>API ComfyUI</span><input id="comfyUrl" type="text" value="${esc(tree.comfy_url)}"></label><button class="btn" id="saveProject">Enregistrer configuration</button><div class="warning">Les guides doivent exister dans le dossier input configuré. L'application ne copie pas automatiquement les fichiers ailleurs.</div>`}
else if(loc==='scene'){h+=`<div class="eyebrow">Validation de scène</div><div class="card"><div class="spaced"><b>Verrou de scène Ready</b><input type="checkbox" id="scenelock" ${scene.locked?'checked':''}></div><p class="small">Ready automatique si tous les clips sont validés. Verrou manuel possible pour exclure toute la scène.</p></div><div class="eyebrow">État</div><p>${scene.auto_ready?'Tous les clips sont Ready.':scene.clips.filter(c=>c.ready).length+' sur '+scene.clips.length+' clips Ready.'}</p>`}
else{h+=`<div class="eyebrow">Validation artistique</div><div class="card"><div class="spaced"><b>Clip Ready</b><input type="checkbox" id="ready" ${clip.ready?'checked':''}></div><p class="small">N'est jamais activé automatiquement après une génération. Un clip Ready est ignoré lors du rendu de sa scène ou du projet.</p></div><label class="field"><span>Préfixe du fichier vidéo</span><input type="text" id="outprefix" value="${esc(clip.output_prefix)}"></label><div class="warning" style="margin-top:15px">La sauvegarde durable des latents de passe 1 et leur rechargement ne sont pas encore câblés dans ce workflow. Ne pas supprimer les rendus intermédiaires.</div>`}
$('#inspector').innerHTML=h;$('#pass2').value=setting;$('#saveScopePass').onclick=savePass2;
if(loc==='project')$('#saveProject').onclick=saveProject;
if(loc==='scene')$('#scenelock').onchange=async e=>{try{await request('/api/scope',{level:'scene',id:scene.id,values:{locked:e.target.checked}});await loadTree();toast('État de scène conservé')}catch(ex){toast(ex.message,true)}};
if(loc==='clip'){$('#ready').onchange=toggleReady;$('#outprefix').addEventListener('input',markDirty)};
}
function markDirty(){dirty=true;const e=$('#saveStatus');if(e)e.textContent='● Modifications non enregistrées'}
function updateGuidesPayload(){const d={};for(let name of ['first','middle','last']){const card=$(`[data-guide="${name}"]`);const activated=name==='first'?true:card.querySelector('[data-on]').checked;d[name]={enabled:activated,filename:$(`[data-filename="${name}"]`).value};if(name==='middle'){d[name].time=parseFloat($('[data-time="middle"]').value);d[name].old_frame=clip.guides.middle.frame}else if(name==='last'){d[name].old_frame=clip.guides.last.frame}}return d}
async function saveClip(){try{let c=clip;let values={duration:Number($('#duration').value),prompt:$('#prompt').value,negative_prompt:$('#negative').value,output_prefix:$('#outprefix').value,...updateGuidesPayload(),pass2:$('#pass2').value};clip=await request('/api/clip',{key:c.key,values});dirty=false;await loadTree();toast('Workflow '+c.key+' enregistré : JSON mis à jour')}catch(e){toast(e.message,true)}}
async function savePass2(){try{if(selection.level==='clip'){markDirty();await saveClip();return}const loc=selection.level;await request('/api/scope',{level:loc,id:selection.id,values:{pass2:loc==='project'?$('#pass2').value==='on':$('#pass2').value}});await loadTree();toast('Deuxième passe mise à jour dans les JSON concernés')}catch(e){toast(e.message,true)}}
async function saveProject(){try{await request('/api/scope',{level:'project',values:{project_name:$('#projectName').value,input_dir:$('#inputDir').value,comfy_url:$('#comfyUrl').value}});await loadTree();await checkStatus();toast('Configuration enregistrée')}catch(e){toast(e.message,true)}}
async function toggleReady(e){if(dirty&&!confirm('Enregistrer les modifications du clip avant de le marquer Ready ?')){e.target.checked=!e.target.checked;return}try{if(dirty)await saveClip();await request('/api/ready',{key:clip.key,ready:e.target.checked});await loadTree();toast('Validation conservée')}catch(ex){toast(ex.message,true)}}
async function browse(part){try{let data=await request('/api/images');let items=data.images;let holder=document.createElement('div');holder.className='modalbg';holder.innerHTML=`<div class="modal"><div class="spaced"><b>Images de ComfyUI/input</b><button class="btn sm" id="closeModal">Fermer</button></div><div class="small">${esc(data.directory)} · ${items.length} fichiers</div><input type="text" id="filterImages" placeholder="Filtrer les noms d’images..."><div class="imagelist" id="imageList"></div></div>`;$('#overlays').append(holder);const listing=$('#imageList',holder);function fill(f=''){const matches=items.filter(x=>x.toLowerCase().includes(f.toLowerCase())).slice(0,350);listing.innerHTML=matches.map(x=>`<button class="imageopt" data-name="${esc(x)}"><img loading="lazy" src="/api/image?name=${encodeURIComponent(x)}"><span>${esc(x)}</span></button>`).join('')||'<p>Aucune image correspondante.</p>';$$('[data-name]',listing).forEach(b=>b.onclick=()=>{$(`[data-filename="${part}"]`).value=b.dataset.name;holder.remove();markDirty()})}fill();$('#filterImages',holder).oninput=e=>fill(e.target.value);$('#closeModal',holder).onclick=()=>holder.remove();holder.onclick=e=>{if(e.target===holder)holder.remove()}}catch(e){toast(e.message,true)}}
async function loadQueue(){try{queueData=await request('/api/queue');const q=queueData;$('#queueStatus').textContent=`File · ${q.state==='running'?'En cours':q.state==='paused'?'En pause':q.state==='stopping'?'Arrêt en cours':'Inactive'}`;$('#queueDetail').textContent=`${q.active?.key||'Aucun actif'} · ${q.pending?.length||0} restant(s)${q.last_error?' · '+q.last_error:''}`;$('#queueDetail').classList.toggle('qerr',!!q.last_error);$('#pause').disabled=q.state!=='running';$('#resume').disabled=q.state!=='paused';$('#stop').disabled=!['running','paused'].includes(q.state);$('#interrupt').disabled=!q.active; }catch(e){}}
async function checkStatus(){const d=await request('/api/status');$('#connDot').classList.toggle('ok',!!d.connected);$('#connText').textContent=d.connected?'ComfyUI · connecté':'ComfyUI · hors ligne'}
async function generate(){if(dirty){toast('Enregistre le clip avant de générer pour envoyer son JSON à jour.',true);return}let loc=selection.level,ident=selection.id;try{let result=await request('/api/generate',{level:loc,id:ident,force:false});toast(`${result.queued.length} clip(s) en file, ${result.skipped.length} Ready ignoré(s)`);await loadQueue()}catch(e){toast(e.message,true)}}
async function qcontrol(action){try{await request('/api/queue',{action});await loadQueue();toast(action==='stop'?'Arrêt propre demandé':action==='pause'?'Pause après le clip actif':action==='resume'?'Reprise demandée':'Interruption immédiate demandée')}catch(e){toast(e.message,true)}}
$('#generate').onclick=generate;$('#refresh').onclick=()=>loadTree().catch(e=>toast(e.message,true));for(let a of ['pause','resume','stop','interrupt'])$('#'+a).onclick=()=>qcontrol(a);
loadTree().catch(e=>toast(e.message,true));checkStatus().catch(()=>{});setInterval(loadQueue,1800);setInterval(checkStatus,14000);
</script></body></html>
